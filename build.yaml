# lib/core/music/genre_catalog.g.dart is generated by
# script/music/build_genre_catalog.py, not by build_runner. Without this
# exclusion `build_runner build --delete-conflicting-outputs` deletes it.
targets:
  $default:
    builders:
      source_gen:combining_builder:
        generate_for:
          exclude:
            - lib/core/music/genre_catalog.dart
