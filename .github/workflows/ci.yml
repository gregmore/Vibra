name: Vibra CI/CD Hardening

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  flutter-test:
    name: Flutter Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create dummy .env for CI
        run: |
          touch .env
          python3 script/security/prepare_client_env.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

      # (Opzionale) Upload coverage ad un servizio come Codecov
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage/lcov.info

      - name: Run Map Package Tests
        working-directory: packages/flutter_map_marker_cluster
        run: |
          flutter pub get
          flutter test

      # Native device checks live in script/security/native/ as a separate
      # harness, so the integration_test plugin stays out of the shipping app.

  supabase-test:
    name: Supabase Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local
        run: supabase start

      - name: Run Supabase DB & RLS Tests
        run: supabase test db

      - name: Run Edge Functions Unit Tests
        run: deno test --allow-env=FCM_SERVICE_ACCOUNT_JSON,FIREBASE_SERVICE_ACCOUNT_JSON supabase/functions/event-reminders/reminder.test.ts supabase/functions/_shared/fcm.test.ts supabase/functions/calculate-match/index.test.ts supabase/functions/sync-music-profile/genres.test.ts

      - name: Check Edge Functions
        run: deno check supabase/functions/*/index.ts
