name: Vibra CI/CD Hardening

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  flutter-test:
    name: Flutter Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create dummy .env for CI
        run: touch .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

      # (Opzionale) Upload coverage ad un servizio come Codecov
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage/lcov.info

      # The files in integration_test are currently mock/skeleton flows. Keep
      # Android compilation as the reliable native smoke check until those
      # scenarios have deterministic test accounts and assertions.
      - name: Build Android Debug APK
        run: flutter build apk --debug

  supabase-test:
    name: Supabase Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase Local
        run: supabase start

      - name: Run Supabase DB & RLS Tests
        run: supabase test db

      - name: Run Edge Functions Unit Tests
        run: deno test --allow-all supabase/functions/calculate-match/index.test.ts

      - name: Stop Supabase Local
        if: always()
        run: supabase stop --no-backup
