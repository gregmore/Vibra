name: vibra
description: "Non ascoltare la musica. Vivila. — Collega streaming musicale ed eventi dal vivo."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigazione
  go_router: ^14.8.1

  # Backend — Supabase
  supabase_flutter: ^2.9.0

  # Autenticazione OAuth
  flutter_secure_storage: ^10.3.1
  flutter_web_auth_2: ^6.0.0-alpha.5
  crypto: ^3.0.7

  # HTTP Client
  dio: ^5.7.0

  # UI & Design
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Mappe & Geolocalizzazione
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Firebase (notifiche push)
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Utilità
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  package_info_plus: ^8.1.3
  device_info_plus: ^11.2.0
  in_app_review: ^2.0.10
  flutter_dotenv: ^5.2.1
  # Data classes
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  translator: ^1.0.4+1
  flutter_map_marker_cluster: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

  # Testing
  http: ^1.6.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.public
    - assets/fonts/inter-OFL.txt
    - assets/fonts/syne-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700

dependency_overrides:
  flutter_map_marker_cluster:
    path: ./packages/flutter_map_marker_cluster
